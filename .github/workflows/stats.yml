name: Update GitHub stats and snake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/github_stats.py, scripts/build_assets.py]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats SVGs
        run: python scripts/github_stats.py
        env:
          # Add a STATS_TOKEN secret (classic PAT, read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mali-anjum
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#f5b14c&color_dots=#161b22,#0e4a44,#15766b,#1fa592,#2dd4bf
            assets/snake-light.svg?color_snake=#b45309&color_dots=#ebedf0,#a7e3da,#5cc4b3,#1a9e8c,#0f766e
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/snake-*.svg
          git diff --cached --quiet || { git commit -m "Update GitHub stats and snake"; git push; }

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" role="img" aria-label="Stack from physics to AI agents"><title>Stack from physics to AI agents</title><style>.pulse{fill:none;stroke-linecap:round;stroke-dasharray:28 900;animation:run 3.2s linear infinite}@keyframes run{from{stroke-dashoffset:928}to{stroke-dashoffset:0}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1198" height="640" rx="18" fill="#161b22" stroke="#30363d"/><text x="48" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">One stack, electrons to agents</text><text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">Each layer is something I have built on, and each builds on the one below.</text><line x1="80" y1="135.0" x2="80" y2="579.0" stroke="#30363d" stroke-width="2"/><path class="pulse" d="M80,579.0 V135.0" stroke="#2dd4bf" stroke-width="3"/><rect x="112" y="104" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="104" width="6" height="62" rx="3" fill="#2dd4bf"/><circle cx="80" cy="135.0" r="9" fill="#161b22" stroke="#2dd4bf" stroke-width="2.5"/><text x="140" y="141.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L6</text><text x="184" y="142.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Agents</text><text x="320" y="141.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">LangGraph RAG, autonomous scheduling, work agents</text><text x="1128" y="141.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2dd4bf">LangChain · LangGraph</text><rect x="112" y="178" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="178" width="6" height="62" rx="3" fill="#4eceac"/><circle cx="80" cy="209.0" r="9" fill="#161b22" stroke="#4eceac" stroke-width="2.5"/><text x="140" y="215.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L5</text><text x="184" y="216.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Software</text><text x="320" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">Next.js, React Native, FastAPI, .NET, Supabase</text><text x="1128" y="215.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#4eceac">web + mobile, shipped</text><rect x="112" y="252" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="252" width="6" height="62" rx="3" fill="#70c899"/><circle cx="80" cy="283.0" r="9" fill="#161b22" stroke="#70c899" stroke-width="2.5"/><text x="140" y="289.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L4</text><text x="184" y="290.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Systems</text><text x="320" y="289.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">Solar-powered smart irrigation on ATmega328P</text><text x="1128" y="289.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#70c899">−80% water use</text><rect x="112" y="326" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="326" width="6" height="62" rx="3" fill="#91c286"/><circle cx="80" cy="357.0" r="9" fill="#161b22" stroke="#91c286" stroke-width="2.5"/><text x="140" y="363.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L3</text><text x="184" y="364.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Chips</text><text x="320" y="363.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">Edge-AI MAC accelerator, RTL → GDSII on SKY130</text><text x="1128" y="363.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#91c286">−62.8% energy</text><rect x="112" y="400" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="400" width="6" height="62" rx="3" fill="#b2bd72"/><circle cx="80" cy="431.0" r="9" fill="#161b22" stroke="#b2bd72" stroke-width="2.5"/><text x="140" y="437.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L2</text><text x="184" y="438.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Circuits</text><text x="320" y="437.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">CMOS ring oscillator &amp; current-starved VCO</text><text x="1128" y="437.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b2bd72">109× tuning range</text><rect x="112" y="474" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="474" width="6" height="62" rx="3" fill="#d4b75f"/><circle cx="80" cy="505.0" r="9" fill="#161b22" stroke="#d4b75f" stroke-width="2.5"/><text x="140" y="511.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L1</text><text x="184" y="512.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Devices</text><text x="320" y="511.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">2D MOSFET TCAD: Poisson + drift-diffusion</text><text x="1128" y="511.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#d4b75f">V_TH · I_ON/I_OFF · SS</text><rect x="112" y="548" width="1040" height="62" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="112" y="548" width="6" height="62" rx="3" fill="#f5b14c"/><circle cx="80" cy="579.0" r="9" fill="#161b22" stroke="#f5b14c" stroke-width="2.5"/><text x="140" y="585.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">L0</text><text x="184" y="586.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Physics</text><text x="320" y="585.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">BS Physics, Bahauddin Zakariya University</text><text x="1128" y="585.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#f5b14c">CGPA 3.61</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" role="img" aria-label="Stack from physics to AI agents"><title>Stack from physics to AI agents</title><style>.pulse{fill:none;stroke-linecap:round;stroke-dasharray:28 900;animation:run 3.2s linear infinite}@keyframes run{from{stroke-dashoffset:928}to{stroke-dashoffset:0}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1198" height="640" rx="18" fill="#f6f8fa" stroke="#d0d7de"/><text x="48" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2328">One stack, electrons to agents</text><text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Each layer is something I have built on, and each builds on the one below.</text><line x1="80" y1="135.0" x2="80" y2="579.0" stroke="#d0d7de" stroke-width="2"/><path class="pulse" d="M80,579.0 V135.0" stroke="#0f766e" stroke-width="3"/><rect x="112" y="104" width="1040" height="62" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="112" y="104" width="6" height="62" rx="3" fill="#0f766e"/><circle cx="80" cy="135.0" r="9" fill="#f6f8fa" stroke="#0f766e" stroke-width="2.5"/><text x="140" y="141.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#59636e">L6</text><text x="184" y="142.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Agents</text><text x="320" y="141.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">LangGraph RAG, autonomous scheduling, work agents</text><text x="1128" y="141.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0f766e">LangChain · LangGraph</text><rect x="112" y="178" width="1040" height="62" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="112" y="178" width="6" height="62" rx="3" fill="#2a705d"/><circle cx="80" cy="209.0" r="9" fill="#f6f8fa" stroke="#2a705d" stroke-width="2.5"/><text x="140" y="215.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#59636e">L5</text><text x="184" y="216.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Software</text><text x="320" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Next.js, React Native, FastAPI, .NET, Supabase</text><text x="1128" y="215.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2a705d">web + mobile, shipped</text><rect x="112" y="252" width="1040" height="62" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="112" y="252" width="6" height="62" rx="3" fill="#466a4c"/><circle cx="80" cy="283.0" r="9" fill="#f6f8fa" stroke="#466a4c" stroke-width="2.5"/><text x="140" y="289.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#59636e">L4</text><text x="184" y="290.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Systems</text><text x="320" y="289.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Solar-powered smart irrigation on ATmega328P</text><text x="1128" y="289.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#466a4c">−80% water use</text><rect x="112" y="326" width="1040" height="62" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="112" y="326" width="6" height="62" rx="3" fill="#62643c"/><circle cx="80" cy="357.0" r="9" fill="#f6f8fa" stroke="#62643c" stroke-width="2.5"/><text x="140" y="363.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#59636e">L3</text><text x="184" y="364.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Chips</text><text x="320" y="363.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Edge-AI MAC accelerator, RTL → GDSII on SKY130</text><text x="1128" y="363.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#62643c">−62.8% energy</text><rect x="112" y="400" width="1040" height="62" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="112" y="400" width="6" height="62" rx="3" fill="#7d5f2b"/><circle cx="80" cy="431.0" r="9" fill="#f6f8fa" stroke="#7d5f2b" stroke-width="2.5"/><text x="140" y="437.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#59636e">L2</text><text x="184" y="438.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Circuits</text><text x="320" y="437.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">CMOS ring oscillator &amp; current-starved VCO</text><text x="1128" y="437.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#7d5f2b">109× tuning range</text><rect x="112" y="474" width="1040" height="62" rx="12" fill=